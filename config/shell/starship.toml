command_timeout = 1500
add_newline = true
scan_timeout = 80

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:#4d1a3c)\
$os\
$username\
[](fg:#4d1a3c bg:#f935b1)\
$directory\
[](fg:#f935b1 bg:#4d1a3c)\
$git_branch\
$git_status\
[](fg:#4d1a3c bg:#f935b1)\
$c\
$cpp\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$python\
$scala\
[](fg:#f935b1 bg:#4d1a3c)\
$docker_context\
[](fg:#4d1a3c bg:#f935b1)\
$time\
[ ](fg:#f935b1)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "fg:#a9b1d6 bg:#4d1a3c"
style_root = "fg:#a9b1d6 bg:#4d1a3c"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#1b1e2e"
disabled = true # Disabled by default

[directory]
style = "fg:#1b1e2e bg:#f935b1"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "fg:#1b1e2e bg:#f935b1"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "fg:#1b1e2e bg:#f935b1"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#4d1a3c fg:#a9b1d6"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "fg:#1b1e2e bg:#f935b1"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "fg:#1b1e2e bg:#f935b1"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "fg:#a9b1d6 bg:#4d1a3c"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:#a9b1d6 bg:#4d1a3c"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "fg:#1b1e2e bg:#f935b1"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "fg:#1b1e2e bg:#f935b1"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "fg:#1b1e2e bg:#f935b1"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "fg:#1b1e2e bg:#f935b1"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "fg:#1b1e2e bg:#f935b1"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "fg:#1b1e2e bg:#f935b1"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "fg:#1b1e2e bg:#f935b1"
format = '[ $symbol ($version) ]($style)'

[rust]
style = "fg:#1b1e2e bg:#f935b1"
symbol = ""
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "fg:#1b1e2e bg:#f935b1"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#f935b1 fg:#1b1e2e"
format = '[ ♥ $time ]($style)'

[python]
disabled = false
format = "[ $symbol $version ($virtualenv) ]($style)"
symbol = "󰌠"
style = "fg:#1b1e2e bg:#f935b1"
