# Read the documentation before using the `docker-compose.yml` file:
# https://docs.searxng.org/admin/installation-docker.html

name: searxng

services:
  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: always
    ports:
      - target: ${SEARXNG_PORT:-8080}
        published: ${SEARXNG_PORT:-8080}
        protocol: tcp
    env_file: ./.env
    volumes:
      - ./core-config/:/etc/searxng/:Z
      - core-data:/var/cache/searxng/
      - ./searx/static/themes/simple/custom/catppuccin.css:/usr/local/searxng/searx/static/themes/simple/custom/catppuccin.css:ro
      - ./searx/templates/simple/base.html:/usr/local/searxng/searx/templates/simple/base.html:ro
    networks:
      - searxng-net
    x-casaos:
      ports:
        - container: "8080"
          description:
            en_us: Web UI port
      volumes:
        - container: /etc/searxng
          description:
            en_us: SearXNG configuration directory (settings.yml, favicons.toml, etc.)
        - container: /var/cache/searxng
          description:
            en_us: Cache directory

  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - valkey-data:/data/
    networks:
      - searxng-net
    x-casaos:
      volumes:
        - container: /data
          description:
            en_us: Valkey (Redis-compatible) data

  # tor:
  #   container_name: tor-proxy
  #   image: peterdavehello/tor-socks-proxy:latest
  #   restart: always
  #   ports:
  #     - "9983:9050"
  #   networks:
  #     - searxng-net

networks:
  searxng-net:
    driver: bridge

volumes:
  core-data:
  valkey-data:

x-casaos:
  architectures:
    - amd64
    - arm64
  main: core
  author: community
  category: Network
  title:
    en_us: SearXNG
  tagline:
    en_us: Privacy-respecting metasearch engine
  description:
    en_us: |
      SearXNG is a free internet metasearch engine which aggregates results from various search services and databases.
      Users are neither tracked nor profiled. This stack includes Valkey for the rate limiter and optional Tor support.
  developer: SearXNG Team
  icon: data:image/svg+xml;base64,
  thumbnail: data:image/svg+xml;base64,
  index: /
  port_map: "8080"
  scheme: http
  tips:
    before_install:
      en_us: |
