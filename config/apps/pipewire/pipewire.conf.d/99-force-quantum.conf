# Pin PipeWire's buffer to 1024 frames. Smaller buffers chosen on the fly by
# apps cause crackling under load; min = max fixes the quantum at 1024.
# (default.clock.force-quantum is not a PipeWire setting and is ignored.)
context.properties = {
    default.clock.min-quantum = 1024
    default.clock.max-quantum = 1024
}
