; DMS colours for Spotify. Generated on every theme change by matugen; edit
; the template in fedora-nothing, never this file.
;
; Values are bare hex with no leading #, which is what spicetify's colour
; parser wants. replace_colors = 1 in config-xpui.ini turns each key into
; --spice-<key> and --spice-rgb-<key> inside Spotify's colors.css.
;
; The section name is what `color_scheme` in config-xpui.ini selects.
;
; Spotify needs eight surface keys and a Material palette offers four usable
; dark tones, so some of them necessarily share a value. The mapping is chosen
; so no two colliding keys paint adjacent or stacked regions, and so the ladder
;
;   background < surface_container{,_low} < _high < _highest / surface_bright
;
; stays monotone: every hover state is lighter than whatever it sits on. Note
; that `surface` is not the darkest tone here -- DMS's matugen run puts it one
; step above `background` -- so the page base is `background`.
[dms]
text               = {{colors.on_surface.default.hex_stripped}}
; outline, not on_surface_variant: in some DMS themes on_surface_variant is
; brighter than on_surface, which would invert the type hierarchy.
subtext            = {{colors.outline.default.hex_stripped}}
main               = {{colors.background.default.hex_stripped}}
main-elevated      = {{colors.surface_container_high.default.hex_stripped}}
highlight          = {{colors.surface_container_high.default.hex_stripped}}
highlight-elevated = {{colors.surface_container_highest.default.hex_stripped}}
sidebar            = {{colors.surface_container.default.hex_stripped}}
player             = {{colors.surface_container_low.default.hex_stripped}}
card               = {{colors.surface_container_high.default.hex_stripped}}
shadow             = {{colors.shadow.default.hex_stripped}}
selected-row       = {{colors.primary.default.hex_stripped}}
button             = {{colors.primary.default.hex_stripped}}
button-active      = {{colors.primary.default.hex_stripped}}
; The seekbar and volume track. A bright colour here reads as a filled bar.
button-disabled    = {{colors.surface_bright.default.hex_stripped}}
tab-active         = {{colors.primary_container.default.hex_stripped}}
notification       = {{colors.primary.default.hex_stripped}}
notification-error = {{colors.error.default.hex_stripped}}
misc               = {{colors.outline.default.hex_stripped}}
