# Spotify's colours, applied through spicetify.
#
# Assembled into config.toml only when this component is selected AND a
# spicetify is already on the machine: this repository never installs Spotify
# or spicetify. On a machine without it there is no [templates.*] block, so
# matugen does no extra work and the hook below never runs.
[templates.spicetify_dms]
input_path = '~/.config/matugen/templates/spicetify-dms.ini'
output_path = '~/.config/spicetify/Themes/dms/color.ini'
post_hook = '~/.config/hypr/scripts/spicetify-refresh'
