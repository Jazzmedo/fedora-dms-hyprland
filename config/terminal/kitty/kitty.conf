# Font Configuration
font_size 10.0

# Window Configuration
window_padding_width 12
# Opaque rendering keeps window movement light on the compositor.
background_opacity 1.0
background_blur 0
hide_window_decorations yes

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled

# Dank color generation
include dank-tabs.conf
include dank-theme.conf


# Enable the trail (value = minimum time in ms the cursor must stay still before a trail starts)
cursor_trail 200

# How fast the trail fades (fastest decay, slowest decay) in seconds
cursor_trail_decay 0.1 0.4

# Minimum distance (in cells) the cursor must move before the trail appears
# You can also use two values: horizontal vertical
cursor_trail_start_threshold 2
