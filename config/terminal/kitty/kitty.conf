# Font Configuration
font_size 10.0

# Window Configuration
window_padding_width 12
# Opaque rendering keeps window movement light on the compositor.
background_opacity 1.0
background_blur 0
hide_window_decorations yes

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings: all kitty shortcuts disabled so TUI apps get every key.
clear_all_shortcuts yes

# ...except the clipboard. clear_all_shortcuts removes these too, and then
# ctrl+shift+v is no longer a paste request: kitty passes it through as the
# key CSI 118;6u, which zsh cannot decode -- it eats the ESC [ 1 1 and leaves
# the literal text "8;6u" on the command line, pasting nothing. No TUI needs
# these three combinations, so restoring them costs nothing.
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map shift+insert paste_from_selection

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled

# Dank color generation
include dank-tabs.conf
include dank-theme.conf


# Enable the trail (value = minimum time in ms the cursor must stay still before a trail starts)
cursor_trail 200

# How fast the trail fades (fastest decay, slowest decay) in seconds
cursor_trail_decay 0.1 0.4

# Minimum distance (in cells) the cursor must move before the trail appears
# You can also use two values: horizontal vertical
cursor_trail_start_threshold 2
